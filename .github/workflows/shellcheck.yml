name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
          done

      - name: Lint
        run: shellcheck --severity=warning $(git ls-files '*.sh')

      - name: Smoke test cleanup.sh
        run: |
          ./cleanup.sh --help
          ./cleanup.sh --dry-run --json | python3 -m json.tool > /dev/null
          # Unknown options must be rejected, not silently ignored.
          if ./cleanup.sh --not-a-real-flag; then
            echo "unknown flag was accepted" >&2
            exit 1
          fi
